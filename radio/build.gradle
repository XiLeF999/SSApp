plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sansan.radio'
    compileSdk 34

    defaultConfig {
        applicationId "com.sansan.radio"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs{
        signConfig {
            storeFile file ('../platform.jks')//签名文件路径，
            //keystore的路径通常使用项目根目录的相对路径，但也可以是使用绝对路径，尽管这不推荐
            storePassword '123456' //密码
            keyAlias 'platform_key'
            keyPassword '123456'  //密码
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.signConfig
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
        }
        debug {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.signConfig
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    //打包文件名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def newName = "SSRadio.apk"
            output.outputFileName = new File(newName)
        }
    }


    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            Set<File> fileSet = options.bootstrapClasspath.getFiles()
            List<File> newFileList = new ArrayList<>();
            newFileList.add(new File("../libs/framework.jar"))
            newFileList.addAll(fileSet)
            options.bootstrapClasspath = files(
                    newFileList.toArray()
            )
        }
    }


    viewBinding {
        enabled = true
    }


}

dependencies {

    // Kotlin
    implementation 'androidx.core:core-ktx:1.8.0'
    // 协程核心
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0")
    // Android 支持
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")
    // ViewModel 协程支持
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
    // Room 协程支持
    implementation("androidx.room:room-ktx:2.6.0")



    compileOnly files('../libs/framework.jar')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

}