plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

def device_type = "device_type"

android {
    namespace 'com.sansan.video'
    compileSdk 35

    defaultConfig {
        applicationId "com.sansan.video"
        minSdk 30
        //Android 15 的强制全屏（Edge-to-Edge）特性只对 targetSdk >= 35的 App 生效
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs{
        ac8257 {
            storeFile file('../platform.jks')
            storePassword '123456'
            keyAlias 'platform_key'
            keyPassword '123456'
        }
        ac8267 {
            storeFile file('../platform15.jks')//签名文件路径，
            //keystore的路径通常使用项目根目录的相对路径，但也可以是使用绝对路径，尽管这不推荐
            storePassword '123456' //密码
            keyAlias 'platform'
            keyPassword '123456'  //密码
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
        }
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
            signingConfig null
        }
    }

    flavorDimensions device_type

    productFlavors {
        ac8257 {
            dimension device_type
            versionCode 1
            signingConfig signingConfigs.ac8257
        }

        ac8267 {
            dimension device_type
            versionCode 1
            signingConfig signingConfigs.ac8267
        }

        ky1045 {
            dimension device_type
            versionCode 1
            signingConfig signingConfigs.ac8267
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }

        ac8257 {
            assets.srcDirs = ['src/ac8257/assets']
            java.srcDirs = ['src/ac8257/java']
            res.srcDirs = ['src/ac8257/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }

        ac8267 {
            assets.srcDirs = ['src/ac8267/assets']
            java.srcDirs = ['src/ac8267/java']
            res.srcDirs = ['src/ac8267/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }

        ky1045 {
            assets.srcDirs = ['src/ky1045/assets']
            java.srcDirs = ['src/ky1045/java']
            res.srcDirs = ['src/ky1045/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    //这里只能用1.8，否则导入不了framework.jar
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    //打包文件名
    androidComponents {
        onVariants(selector().all(), { variant ->
            variant.outputs.forEach { output ->
                // 提取所有数字（会提取所有连续的数字）
                def numbers = flavorName.findAll(/\d+/)  // 返回列表，如 ["8257"]
                def flavorNameShort = numbers.isEmpty() ? "" : numbers.join("")  // "8257"
                // 取首字母并转为大写
                def buildTypeShort = variant.buildType.substring(0, 1).toUpperCase()
                def versionName = android.defaultConfig.versionName ?: "unknown"
                output.outputFileName.set("Video${flavorNameShort}${buildTypeShort}${versionName}_${packageTime()}.apk")
            }
        })
    }



    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            Set<File> fileSet = options.bootstrapClasspath.getFiles()
            List<File> newFileList = new ArrayList<>();
            newFileList.add(new File("../libs/framework.jar"))
            newFileList.addAll(fileSet)
            options.bootstrapClasspath = files(
                    newFileList.toArray()
            )
        }
    }


    buildFeatures {
        compose true
        viewBinding true
    }


}

static def packageTime() {
    return new Date().format("yyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3

    implementation libs.androidx.appcompat

    implementation libs.material

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    //内存泄漏检查
//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}